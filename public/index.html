<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#171512" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="color-scheme" content="dark light" />
    <title>Task Hub</title>
    <script src="/sw-update.js"></script>
    <link rel="stylesheet" href="/styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🛠️</text></svg>"
    />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#/">
        <span class="brand-mark">▪</span>
        <span>Task Hub</span>
      </a>
      <nav class="tabs" aria-label="Main navigation">
        <a href="#/" data-tab="dashboard">Dashboard</a>
        <a href="#/today" data-tab="today">Today</a>
        <a href="#/inbox" data-tab="inbox">Inbox</a>
        <a href="#/next" data-tab="tasks">Tasks</a>
        <details class="more-nav">
          <summary>More</summary>
          <nav class="more-nav-items" aria-label="More tools">
            <a href="#/projects" data-tab="projects">Projects</a>
            <a href="#/waiting" data-tab="waiting">Waiting</a>
            <a href="#/snoozed" data-tab="snoozed">Snoozed</a>
            <a href="#/views" data-tab="views">Saved views</a>
            <a href="#/drafts" data-tab="drafts">Drafts</a>
            <a href="#/devices" data-tab="devices">Devices</a>
            <a href="#/schedules" data-tab="schedules">Schedules</a>
            <a href="#/chores" data-tab="chores">Chores</a>
            <div id="saved-views-nav" class="more-saved-views" aria-label="Saved views"></div>
            <div class="more-account-actions">
              <button type="button" id="shortcuts" title="Keyboard shortcuts (?)">Keyboard shortcuts</button>
              <button type="button" id="sign-out" hidden>Sign out</button>
            </div>
          </nav>
        </details>
      </nav>
      <div class="topbar-actions">
        <button class="btn btn-primary" id="new-ticket">Add task</button>
      </div>
    </header>

    <main id="view" aria-live="polite"></main>

    <div id="modal-root"></div>
    <div id="toast" role="status" aria-live="polite"></div>

    <script type="module" src="/app.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f8f5ef" media="(prefers-color-scheme: light)" /><meta name="theme-color" content="#171512" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="dark light" />
    <title>Sign in · Task Hub</title>
    <link rel="stylesheet" href="/styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🛠️</text></svg>"
    />
  <link rel="stylesheet" href="/mobile.css" /></head>
  <body class="login-body">
    <main class="login-card">
      <div class="login-brand">
        <span class="brand-mark" aria-hidden="true">▪</span>
        <span>Task Hub</span>
      </div>
      <h1>Welcome back</h1>
      <p class="login-intro">Sign in to your tasks, plans, and home routines.</p>

      <form id="login-form">
        <div class="field">
          <label for="password">Password</label>
          <div class="password-field"><input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
          /><button type="button" id="toggle-password" aria-controls="password" aria-pressed="false">Show</button></div>
        </div>
        <button class="btn btn-primary" type="submit" style="width: 100%">Sign in</button>
        <p id="error" class="login-error" role="alert" hidden></p>
      </form>
    </main>

    <script type="module" src="/login.js"></script>
  </body>
</html>
